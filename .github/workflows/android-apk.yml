name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create native Android Flutter app
        run: |
          rm -rf .mobile-build
          flutter create \
            --platforms=android \
            --org ir.rabinazar \
            --project-name engineering \
            .mobile-build
          cp mobile/lib/main.dart .mobile-build/lib/main.dart
          rm -rf .mobile-build/test

          # Compatibility fixes for the current stable Flutter/Material icon set.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.mobile-build/lib/main.dart')
          t = p.read_text(encoding='utf-8')
          t = t.replace('minHeight: 72,', 'constraints: const BoxConstraints(minHeight: 72),')
          t = t.replace('Icons.sprinkler_rounded', 'Icons.grid_view_rounded')
          t = t.replace('Icons.water_pump_rounded', 'Icons.settings_input_component_rounded')
          t = t.replace('Icons.detector_smoke_rounded', 'Icons.sensors_rounded')
          t = t.replace('separatorBuilder: (_, __)', 'separatorBuilder: (context, index)')
          p.write_text(t, encoding='utf-8')
          PY

          mkdir -p .mobile-build/assets
          base64 --decode mobile/assets/rabin_logo_480.b64 > .mobile-build/assets/rabin_azar_logo.jpg

          mkdir -p .mobile-build/android/app/src/main/res/drawable
          base64 --decode mobile/assets/rabin_icon_192.b64 > .mobile-build/android/app/src/main/res/drawable/rabin_launcher.jpg

          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('.mobile-build/pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          marker = '  uses-material-design: true\n'
          if 'assets/rabin_azar_logo.jpg' not in text:
              text = text.replace(
                  marker,
                  marker + '  assets:\n    - assets/rabin_azar_logo.jpg\n',
                  1,
              )
          pubspec.write_text(text, encoding='utf-8')
          PY

      - name: Add local-storage dependency
        working-directory: .mobile-build
        run: flutter pub add shared_preferences

      - name: Configure Android branding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('.mobile-build/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('android:label="engineering"', 'android:label="Rabin Fire Engineering"')
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/rabin_launcher"')
          manifest.write_text(text, encoding='utf-8')

          splash = '''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/black" />
          </layer-list>
          '''
          for rel in (
              'android/app/src/main/res/drawable/launch_background.xml',
              'android/app/src/main/res/drawable-v21/launch_background.xml',
          ):
              path = Path('.mobile-build') / rel
              if path.exists():
                  path.write_text(splash, encoding='utf-8')
          PY

      - name: Analyze Flutter app
        working-directory: .mobile-build
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: .mobile-build
        run: flutter build apk --release --build-name=2.0.0 --build-number=${{ github.run_number }}

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp .mobile-build/build/app/outputs/flutter-apk/app-release.apk \
             dist/Rabin-Fire-Engineering-v2.0.${{ github.run_number }}.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabin-Fire-Engineering-Android
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
