name: Encrypted database backup to Drive
on:
  workflow_dispatch:
  schedule:
    - cron: '47 23 * * *'
permissions:
  contents: read
concurrency:
  group: encrypted-database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main' && vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: backup
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install encryption tool from Ubuntu repository
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age
      - name: Create encrypted backup and verify remote bytes
        env:
          PGHOST: ${{ secrets.BACKUP_PGHOST }}
          PGUSER: ${{ secrets.BACKUP_PGUSER }}
          PGPASSWORD: ${{ secrets.BACKUP_PGPASSWORD }}
          PG_CA_PEM: ${{ secrets.BACKUP_PG_CA_PEM }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          GDRIVE_CLIENT_ID: ${{ secrets.BACKUP_GOOGLE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_GOOGLE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.BACKUP_GOOGLE_REFRESH_TOKEN }}
          BACKUP_RESTORE_VERIFIED: ${{ vars.BACKUP_RESTORE_VERIFIED }}
        run: python3 scripts/backup/backup.py
